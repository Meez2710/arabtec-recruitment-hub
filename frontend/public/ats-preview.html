<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Arabtec ATS — Responsive Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Arial, Helvetica, sans-serif; background: #eef1f4; color: #17202a; }
    .bar { min-height: 54px; padding: 9px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: #17202a; color: #fff; position: sticky; top: 0; z-index: 10; }
    .bar strong { font-size: 13px; }
    .actions { display: flex; gap: 7px; flex-wrap: wrap; }
    button, a { min-height: 34px; padding: 0 11px; border: 1px solid rgba(255,255,255,.22); border-radius: 7px; color: #fff; background: transparent; font: 700 11px Arial, Helvetica, sans-serif; text-decoration: none; display: inline-flex; align-items: center; cursor: pointer; }
    button.active { background: #0f766e; border-color: #0f766e; }
    .stage { padding: 18px; overflow: auto; }
    .shell { width: 100%; min-width: 320px; margin: 0 auto; transition: width .2s ease; }
    .note { margin-bottom: 8px; color: #667085; font-size: 11px; }
    .frame { background: #fff; border: 1px solid #cfd6df; border-radius: 10px; overflow: hidden; box-shadow: 0 8px 24px rgba(17,24,39,.08); }
    iframe { width: 100%; height: 790px; display: block; border: 0; background: #fff; }
  </style>
</head>
<body>
  <header class="bar">
    <strong>Arabtec ATS · Responsive Preview</strong>
    <div class="actions">
      <button type="button" class="active" data-width="100%">Desktop</button>
      <button type="button" data-width="820px">Tablet</button>
      <button type="button" data-width="390px">Mobile</button>
      <button type="button" id="reload">Reload</button>
      <a href="/ats-editor.html">Open UI Editor</a>
    </div>
  </header>
  <main class="stage">
    <div class="shell" id="shell">
      <div class="note">This preview uses your existing ATS session. No automatic login or embedded credentials are used.</div>
      <div class="frame"><iframe id="frame" src="/?ui_review_frame=1" title="Arabtec ATS responsive preview"></iframe></div>
    </div>
  </main>
  <script>
    const shell = document.getElementById('shell');
    const frame = document.getElementById('frame');
    document.querySelectorAll('[data-width]').forEach((button) => {
      button.addEventListener('click', () => {
        shell.style.width = button.dataset.width;
        document.querySelectorAll('[data-width]').forEach((b) => b.classList.toggle('active', b === button));
      });
    });
    document.getElementById('reload').addEventListener('click', () => frame.contentWindow.location.reload());
  </script>
</body>
</html>

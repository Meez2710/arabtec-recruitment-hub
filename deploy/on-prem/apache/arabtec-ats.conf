# /etc/apache2/sites-available/arabtec-ats.conf
#
# Apache is a reverse proxy ONLY. The Node app serves its own SPA from
# frontend/public, so there is no DocumentRoot to point at and no second copy of
# the frontend to drift out of sync with the deployed commit.
#
# Enable first:  sudo a2enmod proxy proxy_http headers ssl rewrite
#
# TLS: if there is no CA-issued certificate for the internal hostname, issue one
# from the corporate internal CA, or generate a self-signed pair and add it to
# staff machines' trust store. Put the files at the two paths below.

<VirtualHost *:80>
    ServerName ats.arabtec.local              # REPLACE with the real hostname
    RewriteEngine On
    RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName ats.arabtec.local              # REPLACE

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/arabtec-ats.crt       # REPLACE
    SSLCertificateKeyFile /etc/ssl/private/arabtec-ats.key     # REPLACE

    # One proxy hop — matches TRUST_PROXY=1, so req.ip is the real client and
    # cannot be spoofed through X-Forwarded-For.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:4001/    # keep the port in sync with ats.env
    ProxyPassReverse / http://127.0.0.1:4001/

    # CVs are large; the app caps uploads at 20 MB per file.
    LimitRequestBody 26214400
    ProxyTimeout 900                          # a bulk CV parse can run long

    ErrorLog  ${APACHE_LOG_DIR}/arabtec-ats-error.log
    CustomLog ${APACHE_LOG_DIR}/arabtec-ats-access.log combined
</VirtualHost>

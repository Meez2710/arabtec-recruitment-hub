# Fixture fonts, pinned by URL and content hash.
#
# SCOPE NARROWED. This file used to also list RapidOCR model weights by
# hand-transcribed modelscope URL. One of them 404'd on the first CI run, and
# guessing which subset the pinned RapidOCR wants is guesswork that goes stale
# whenever that pin moves. OCR weights are now materialised by RapidOCR itself
# under supervision and recorded in ocr-models.lock — see warm_ocr_assets.py.
#
# What remains here is what genuinely is a fixed, addressable download: the two
# OFL-1.1 fonts the synthetic Arabic fixtures need. Arabic drawn without an
# Arabic-capable font is not an Arabic fixture.
#
# FORMAT
#   <relative-path>  <sha256>  <url>
#
# __RECORD__ means the checksum has not been captured. fetch-ocr-assets.sh
# refuses to install such an asset unless run with --record, which is a
# deliberate, supervised, network-enabled provisioning step. Runtime never
# passes that flag.


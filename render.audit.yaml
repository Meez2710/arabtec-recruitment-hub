# Arabtec ATS — ONLINE AUDIT / UAT environment.
#
# DELIBERATELY A SEPARATE FILE from render.yaml. The production blueprint
# defines `arabtec` (branch main) and `arabtec-staging` (branch staging); if
# the audit service were added there, syncing the blueprint to create it would
# also re-apply production configuration. Nothing in this file can touch the
# production service or the production database.
#
# It is NOT auto-applied. Render reads `render.yaml` by default, so this is
# inert until someone deliberately creates a Blueprint from it — see
# docs/ONLINE_AUDIT_ENVIRONMENT.md.
#
# ISOLATION, stated explicitly:
#   • its own database (arabtec-db-audit) — never the production instance
#   • its own JWT secret, generated by Render, shared with nothing
#   • its own CORS origin
#   • SEED_DEMO_DATA=true, which production sets to "false"
#   • no SMTP, so the environment cannot send mail to anyone
#   • no Sentry, no production integrations, no production secrets

databases:
  # Free tier. Reachable only by services in this same Render account/region —
  # no public ingress, and no port is exposed to the internet.
  - name: arabtec-db-audit
    plan: free
    databaseName: arabtec_audit
    user: arabtec_audit

services:
  - type: web
    name: arabtec-audit
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # Tracks the audit branch ONLY. main and staging are untouched by this file.
    branch: audit/arabtec-pilot-online
    # --include=dev: NODE_ENV=production prunes TypeScript, and the document
    # pipeline must be compiled before the server starts.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false            # an audit environment should not move mid-audit
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      - key: NODE_ENV
        value: production
      # One proxy hop (Render's load balancer), so req.ip is the real client IP
      # and cannot be spoofed through X-Forwarded-For.
      - key: TRUST_PROXY
        value: "1"
      # The AUDIT database. Never the production connection string.
      - key: DATABASE_URL
        fromDatabase:
          name: arabtec-db-audit
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://arabtec-audit.onrender.com"
      # The audit environment NEEDS the demo users — an auditor signs in as a
      # recruiter, a hiring manager and a viewer to compare what each may do.
      # Production sets this to "false".
      - key: SEED_DEMO_DATA
        value: "true"
      # Set the VALUE in the Render dashboard, never here. Rotated after the
      # audit closes.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Deliberately ABSENT, and each absence is a behaviour, not an oversight:
      #   DOCLING_BASE_URL  — no sidecar on this plan, so the document pipeline
      #                       uses the local pdfjs/mammoth parser. Scanned and
      #                       image-only input stays unsupported, exactly as the
      #                       pilot documents it. No parser was faked to fill it.
      #   OCR_BASE_URL      — no external OCR service.
      #   OLLAMA_BASE_URL   — no model endpoint; deterministic rules only.
      #   SMTP_*            — mail off, so the environment cannot email anyone.
      #   SENTRY_DSN        — no error reporting into a production project.

databases:
  - name: arabtec-db
    plan: free
    databaseName: arabtec
    user: arabtec
  # Staging database — isolated from prod so staging tests never touch prod data.
  - name: arabtec-db-staging
    plan: free
    databaseName: arabtec_staging
    user: arabtec_staging

services:
  # ---------------- PRODUCTION ----------------
  - type: web
    name: arabtec
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    branch: main                 # prod tracks main
    # --include=dev: NODE_ENV=production would otherwise prune TypeScript,
    # and the document pipeline has to be compiled before the server starts.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      # NODE_OPTIONS=--experimental-sqlite removed: production uses PostgreSQL, so the
      # SQLite engine (and its experimental flag) is never loaded. Local SQLite dev uses
      # `npm run start:sqlite`. See docs/DEPLOYMENT.md.
      - key: NODE_VERSION
        value: "22.11.0"
      - key: NODE_ENV
        value: production
      # Trust exactly one proxy hop (Render's load balancer) so req.ip is the real
      # client IP and cannot be spoofed via X-Forwarded-For. See docs/SECURITY_HARDENING.md.
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: arabtec-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://arabtec.onrender.com"
      # Demo sample-users are NOT seeded in production.
      - key: SEED_DEMO_DATA
        value: "false"
      # Error tracking — set the DSN value in the Render dashboard (do NOT commit it).
      # Absent = Sentry disabled (app runs normally).
      - key: SENTRY_DSN
        sync: false
      # --- Feature secrets: set VALUES in the Render dashboard, never in this file. ---
      # sync:false = "this key is required but its value is managed as a secret".
      # Full reference and which features each enables: docs/ENVIRONMENT_VARIABLES.md
      # Microsoft 365 careers mailbox — delegated OAuth. Set all of the first
      # four together or none; MICROSOFT_TOKEN_ENCRYPTION_KEY is REQUIRED
      # whenever they are set (the app refuses to start without it) because the
      # MSAL token cache is encrypted at rest. Setup: docs/MICROSOFT_365_INTEGRATION.md
      #
      # NOTE for Render: MS_REDIRECT_URI must be this service's own public HTTPS
      # URL + /api/integrations/microsoft/callback, and it must be registered as
      # a Web redirect URI on the Entra app. Render's free tier has no persistent
      # disk, but that does not matter here — the token cache lives in Postgres.
      #
      # THERE IS NO SCHEDULED MAILBOX SCAN ON RENDER, and that is deliberate.
      # Unattended scanning is the on-prem systemd timer (arabtec-m365-sync.timer,
      # 08:00 Africa/Cairo); this service exposes only the System-Admin-triggered
      # POST /api/integrations/microsoft/sync. Setting the variables below on
      # Render therefore enables Connect and manual scans but NOT automatic
      # ingestion — mail would sit unread until someone pressed the button.
      # On-prem is the system of record and Render is being decommissioned
      # (deploy/on-prem/07-decommission-render.md), so no Render cron is added
      # here. If Render ever becomes the deployment of record, add a Render cron
      # job hitting that route, or this integration is only half-wired.
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_MAILBOX
        sync: false
      - key: MS_REDIRECT_URI
        sync: false
      - key: MICROSOFT_TOKEN_ENCRYPTION_KEY
        sync: false
      # Email. With Microsoft 365 connected, mail goes out through Graph
      # (POST /me/sendMail) on that same grant and NO SMTP password is needed.
      # SMTP below is the fallback only; leave unset to keep it off.
      - key: MAIL_PROVIDER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      # CV reading. Claude reads the document itself — scanned pages and Arabic
      # included — so there is no sidecar, no OCR service and no local model to
      # configure. Unset the key and no reader is wired: uploads are kept and the
      # intake says so, rather than being parsed badly by something else.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional. Defaults to claude-opus-5. claude-haiku-4-5 is ~5x cheaper and
      # faster, at some accuracy cost — worth it for high-volume inbox scanning.
      - key: ANTHROPIC_MODEL
        sync: false
      # Uploads / CV watcher (set a persistent path once on VPS/Coolify):
      - key: UPLOAD_DIR
        sync: false
      - key: CV_INBOX
        sync: false
      - key: CV_WATCH_INTERVAL_MIN
        sync: false

  # ---------------- STAGING ----------------
  # Mirrors prod but tracks the `staging` branch and uses its own DB. A push to
  # `staging` auto-deploys here, replacing manual file uploads for verification.
  - type: web
    name: arabtec-staging
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    branch: staging
    # --include=dev: NODE_ENV=production would otherwise prune TypeScript,
    # and the document pipeline has to be compiled before the server starts.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      # NODE_OPTIONS=--experimental-sqlite removed: production uses PostgreSQL, so the
      # SQLite engine (and its experimental flag) is never loaded. Local SQLite dev uses
      # `npm run start:sqlite`. See docs/DEPLOYMENT.md.
      - key: NODE_VERSION
        value: "22.11.0"
      - key: NODE_ENV
        value: production
      # Trust exactly one proxy hop (Render's load balancer) so req.ip is the real
      # client IP and cannot be spoofed via X-Forwarded-For. See docs/SECURITY_HARDENING.md.
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: arabtec-db-staging
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://arabtec-staging.onrender.com"
      # Staging may seed demo users for testing convenience.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SENTRY_DSN
        sync: false
